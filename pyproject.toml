[project]
name = "snipeit-copilot-mcp"
version = "1.0.0"
description = "Production Snipe-IT MCP server with Copilot Studio-safe schemas"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.5,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "starlette>=0.47.0,<2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<10.0.0",
  "pytest-asyncio>=0.25.0,<2.0.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "respx>=0.22.0,<1.0.0",
]

[project.scripts]
snipeit-copilot-mcp = "snipeit_copilot_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snipeit_copilot_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: requires an explicitly configured Snipe-IT test instance",
  "destructive: requires SNIPEIT_INTEGRATION_ALLOW_DESTRUCTIVE=true",
]

[tool.coverage.run]
source = ["snipeit_copilot_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

